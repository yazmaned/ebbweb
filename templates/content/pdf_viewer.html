{% extends 'base.html' %}
{% load static %}

{% block title %}{{ material.title }}{% endblock %}

{% block content %}
<div id="controls" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
    <a href="/dashboard/" class="btn"><img src="{% static 'images/icons/arrow-left.svg' %}" width="30" height="30" style="filter: brightness(0) invert(1)"></a>
    <h2>{{ material.title }}</h2>
    <div style="margin-left:auto; display:flex; align-items:center; gap:0.5rem;">
        <button class="btn" id="prev">←</button>
        <span id="page-info" style="color:#888; font-size:0.85rem;"></span>
        <button class="btn" id="next">→</button>
        <button class="btn" id="fullscreen">⛶ Tam Ekran</button>
        <a href="/file/{{ material.pk }}/" target="_blank" class="btn"><img src="{% static 'images/icons/printing-page.svg' %}" width="24" height="24" style="filter: brightness(0) invert(1)"></a>
    </div>
</div>

{% if is_large_pdf %}
<p style="color:#999; font-size:0.8rem; margin-bottom:0.8rem; text-align:center;">Büyük PDF dosyalarının yüklenmesi biraz zaman alabilir.</p>
{% endif %}

<div id="pdf-wrapper" style="display:flex; flex-direction:column; align-items:center; background:#757575; border-radius:8px;">
    <button id="fs-close-fixed" style="display:none;">✕</button>

    <div id="canvas-scroll" style="width:100%; display:flex; justify-content:center; overflow:auto; touch-action:pan-x pan-y;">
        <canvas id="pdf-canvas" style="border-radius:8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);"></canvas>
    </div>
    <div id="fs-controls" style="display:none; gap:0.6rem; align-items:center; justify-content:center; padding:1rem; flex-shrink:0; flex-wrap:wrap;">
        <button class="btn" id="fs-prev">←</button>
        <span id="fs-page-info" style="color:#fff; font-size:0.85rem;"></span>
        <button class="btn" id="fs-next">→</button>
        <button class="btn" id="zoom-out">－</button>
        <span id="zoom-level" style="color:#fff; font-size:0.85rem;">100%</span>
        <button class="btn" id="zoom-in">＋</button>
    </div>
</div>

<style>
    @media (max-width: 768px) {
        #controls {
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        #controls h2 {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        #controls .btn {
            padding: 0.4rem 0.7rem;
            font-size: 0.8rem;
        }
    }
    #pdf-canvas {
        width: 100%;
        display: block;
    }
    #pdf-wrapper:fullscreen {
        display: flex;
        flex-direction: column;
        background: #222;
        padding: 1rem;
        height: 100vh;
        position: relative;
    }
    #pdf-wrapper:fullscreen #canvas-scroll {
        flex: 1;
        overflow: auto;
        align-items: flex-start;
    }
    #pdf-wrapper:fullscreen #pdf-canvas {
        width: auto;
        max-width: none;
        height: auto;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #pdf-wrapper:fullscreen #fs-controls {
        display: flex !important;
    }
    #pdf-wrapper:fullscreen #fs-controls .btn {
        min-width: 44px;
        min-height: 44px;
        font-size: 1rem;
    }

    #pdf-wrapper:fullscreen #fs-close-fixed {
        display: flex !important;
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 9999;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
    }
    #pdf-wrapper:fullscreen #fs-close-fixed:hover {
        background: rgba(0,0,0,0.85);
    }

    @media (max-width: 768px) {
        #pdf-wrapper:fullscreen #fs-controls {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            gap: 0.4rem;
        }
    }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const url = '/file/{{ material.pk }}/';
    const canvas = document.getElementById('pdf-canvas');
    const canvasScroll = document.getElementById('canvas-scroll');
    const ctx = canvas.getContext('2d');
    let pdfDoc = null;
    let currentPage = 1;
    let currentScale = 1.5;
    const MIN_SCALE = 0.5;
    const MAX_SCALE = 4.0;
    const SCALE_STEP = 0.25;

    async function renderPage(num) {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: currentScale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: ctx, viewport }).promise;
        document.getElementById('page-info').textContent = `Page ${num} of ${pdfDoc.numPages}`;
        document.getElementById('fs-page-info').textContent = `Page ${num} of ${pdfDoc.numPages}`;
        updateZoomDisplay();
    }

    function updateZoomDisplay() {
        const percent = Math.round((currentScale / 1.5) * 100);
        document.getElementById('zoom-level').textContent = `${percent}%`;
    }

    pdfjsLib.getDocument(url).promise.then(doc => {
        pdfDoc = doc;
        renderPage(currentPage);
    });

    document.getElementById('prev').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderPage(currentPage); }
    });

    document.getElementById('next').addEventListener('click', () => {
        if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
    });

    document.getElementById('fs-prev').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderPage(currentPage); }
    });

    document.getElementById('fs-next').addEventListener('click', () => {
        if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
        if (currentScale < MAX_SCALE) {
            currentScale += SCALE_STEP;
            renderPage(currentPage);
        }
    });

    document.getElementById('zoom-out').addEventListener('click', () => {
        if (currentScale > MIN_SCALE) {
            currentScale -= SCALE_STEP;
            renderPage(currentPage);
        }
    });

    function enterFullscreen() {
        const wrapper = document.getElementById('pdf-wrapper');
        if (wrapper.requestFullscreen) wrapper.requestFullscreen();
        else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    }

    function exitFullscreen() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }

    document.getElementById('fullscreen').addEventListener('click', enterFullscreen);
    document.getElementById('fs-close-fixed').addEventListener('click', exitFullscreen);

    document.getElementById('pdf-wrapper').addEventListener('click', (e) => {
        if (document.fullscreenElement && e.target.id === 'pdf-wrapper') {
            exitFullscreen();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            if (currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); }
        }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            if (currentPage > 1) { currentPage--; renderPage(currentPage); }
        }
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // ---------- Pinch-to-zoom (touch) ----------
    // Two fingers: track the distance between them. While pinching, apply
    // a cheap CSS transform for instant visual feedback (no re-render cost
    // per frame). Once fingers lift, do one real pdf.js re-render at the
    // final scale so the result stays crisp instead of blurry/stretched.
    let pinchStartDistance = null;
    let pinchStartScale = null;
    let pinchLiveScale = null;

    function touchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    canvasScroll.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            pinchStartDistance = touchDistance(e.touches);
            pinchStartScale = currentScale;
            pinchLiveScale = currentScale;
        }
    }, { passive: true });

    canvasScroll.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDistance) {
            e.preventDefault(); // stop native page zoom/scroll fighting with the gesture
            const newDistance = touchDistance(e.touches);
            const ratio = newDistance / pinchStartDistance;
            pinchLiveScale = Math.min(Math.max(pinchStartScale * ratio, MIN_SCALE), MAX_SCALE);
            const visualRatio = pinchLiveScale / currentScale;
            canvas.style.transform = `scale(${visualRatio})`;
            canvas.style.transformOrigin = 'center center';
        }
    }, { passive: false });

    canvasScroll.addEventListener('touchend', (e) => {
        if (pinchStartDistance !== null && e.touches.length < 2) {
            canvas.style.transform = '';
            if (pinchLiveScale !== null && Math.abs(pinchLiveScale - currentScale) > 0.01) {
                currentScale = pinchLiveScale;
                renderPage(currentPage); // real crisp re-render at the committed scale
            }
            pinchStartDistance = null;
            pinchStartScale = null;
            pinchLiveScale = null;
        }
    }, { passive: true });

    canvasScroll.addEventListener('touchcancel', () => {
        canvas.style.transform = '';
        pinchStartDistance = null;
        pinchStartScale = null;
        pinchLiveScale = null;
    }, { passive: true });
</script>
{% endblock %}
