{% extends 'base.html' %}
{% load static %}
{% block title %}{{ material.title }}{% endblock %}

{% block content %}
<div style="margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;">
    <button id="close-btn" class="btn"><img src="{% static 'images/icons/incorrect.svg' %}" width="24" height="24" style="filter: brightness(0) invert(1)"></button>
    <h2>{{ material.title }}</h2>
</div>

{% if material.material_type == 'video' %}

    <center>
        <video
        controls
        controlsList="nodownload"
        style="width:70%; border-radius:8px; box-shadow: 2 2px 8px rgba(0,0,0,0.1);">
        <source src="/file/{{ material.pk }}/" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    </center>

{% elif material.material_type == 'youtube' %}
  <center>
  <iframe src="{{ material.embed_url }}"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    style="width:100%; max-width:800px; aspect-ratio:16/9; height:auto; border:none; border-radius:12px; display:block;">
     >
  </center>

{% elif material.material_type == 'vimeo' %}
    <iframe
        width="100%"
        height="600px"
        src="{{ material.embed_url }}"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        style="border-radius:8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    </iframe>

{% endif %}

<style>
    /* --- Compact nav override, this page only (base.html untouched) --- */
    nav {
        height: 56px !important;
    }
    nav a[href="/home/"] img {
        display: none !important;
    }
    nav .welcome-text,
    nav .dropdown,
    nav a[href="/accounts/logout"],
    nav a[href="/accounts/login"] {
        display: none !important;
    }
    .accent-bar {
        top: 56px !important;
    }
</style>

<script>
    document.getElementById('close-btn').addEventListener('click', () => {
        window.close();
        setTimeout(() => {
            window.location.href = '/dashboard/';
        }, 300);
    });
</script>
{% endblock %}
